<script>
"use strict";
/* ============================================================
   SPILHAL — fælles spillernavn og highscore-tavle
   Nøglerne deles af alle spil på samme domæne, så forsiden kan vise
   rekorderne. Kontrakten står i repoets README — den samme kode ligger
   i hvert spil, så et spil stadig er én fil uden afhængigheder.
   ============================================================ */
const SPILHAL = {
  NAVNE_NOEGLE: "spilhal.spiller",
  MAKS: 10,
  tavleNoegle(spil) { return "spilhal.tavle." + spil; },

  // localStorage kan være blokeret (privat vindue, direkte filåbning) —
  // spillet skal virke alligevel, bare uden at huske noget.
  spiller() { try { return localStorage.getItem(this.NAVNE_NOEGLE) || ""; } catch (e) { return ""; } },

  saetSpiller(navn) {
    const rent = String(navn || "").replace(/\s+/g, " ").trim().slice(0, 14) || "Spiller";
    try { localStorage.setItem(this.NAVNE_NOEGLE, rent); } catch (e) { }
    return rent;
  },

  tavle(spil) {
    try {
      const raa = JSON.parse(localStorage.getItem(this.tavleNoegle(spil)) || "[]");
      if (!Array.isArray(raa)) return [];
      return raa.filter(r => r && typeof r.point === "number" && typeof r.navn === "string");
    } catch (e) { return []; }
  },

  /* Én plads pr. navn — den bedste. Så kan et spil skrive løbende uden at
     fylde tavlen med den samme spillers dårlige forsøg. Returnerer true,
     hvis navnet nu ligger øverst.                                        */
  gem(spil, navn, point) {
    point = Math.round(point);
    if (!(point > 0) || !navn) return false;
    const liste = this.tavle(spil);
    const dato = new Date().toISOString().slice(0, 10);
    const i = liste.findIndex(r => r.navn === navn);
    if (i >= 0) {
      if (liste[i].point >= point) return false;
      liste[i] = { navn, point, dato };
    } else liste.push({ navn, point, dato });
    liste.sort((a, b) => b.point - a.point);
    if (liste.length > this.MAKS) liste.length = this.MAKS;
    try { localStorage.setItem(this.tavleNoegle(spil), JSON.stringify(liste)); } catch (e) { }
    return liste[0].navn === navn;
  },

  bedste(spil) { return this.tavle(spil)[0] || null; }
};

/* Navneboksen vises ved hver start med det huskede navn skrevet ind, så
   man kan spille videre med ét tryk — eller skrive et andet navn, hvis
   det er en anden, der har telefonen.                                   */
(function navneboks() {
  const boks = document.getElementById("navneboks");
  const felt = document.getElementById("navnefelt");
  const knap = document.getElementById("navneknap");
  felt.value = SPILHAL.spiller();
  function luk() {
    SPILHAL.saetSpiller(felt.value);
    boks.hidden = true;
    document.dispatchEvent(new CustomEvent("spilhal:klar"));
  }
  knap.addEventListener("click", luk);
  felt.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); luk(); } });
  boks.hidden = false;
  setTimeout(() => { try { felt.focus(); felt.select(); } catch (e) { } }, 60);
})();
</script>
<script>
"use strict";

/* ============================================================
   JITSUJAGT — brudlinjer
   Blokken er en struktur, ikke en livsbar. Man vælger hvor og i
   hvilken rækkefølge man slår; stødet forplanter sig gennem
   materialerne, og det, der mister sin bæring, falder ned og
   smadrer det, det lander på.

   Hele designet hviler på én måling: en grådig robot ("ryd flest
   celler nu") bruger 9,8 slag, hvor en optimal bruger 7,8. Derfor
   forkaster generatoren enhver struktur, hvor grådigt spil allerede
   er optimalt — så der er en beslutning i hver eneste blok.
   Se DESIGN.md for målemetoden og portene.
   ============================================================ */

/* ---------- balancetal, samlet ét sted ---------- */
const TUNE = {
  slack: 3,               // slagbudget = par + 3 (par + 4 med skjulte celler)
  slackSkjult: 4,
  restbetaling: 0.25,     // andel af mynterne, hvis budgettet sprænges
  loftBonus: 1.5,         // loft over (par/slag)^2, hvis man slår par

  myntGrund: 10, myntGange: 1.55,   // mynter for en blok i world w
  blokkePrWorld: 6,

  fokusStart: 5,          // hvad man kan have udrustet på én gang
  fokusPrBaelte: 1,
  fokusPrRebirth: 1,
  rebirthDybdeTrin: 8,    // hver 8. world dybde giver et ekstra fokus

  genForsoeg: 40,         // forsøg på at finde en struktur med en beslutning i
  /* Bredde 14 var for lidt: den fandt løsninger på 11 slag, hvor der
     fandtes en på 10 — og så var "par" for højt, budgettet for mildt og
     bæltet for let at vinde. Bredde 40 koster 40-60 ms pr. struktur, og
     det er kun ved blokskift.                                          */
  beamBredde: 40,
  beamGrov: 8,            // billig forsigtning, se lavBlok
  beamDybde: 22,

  gemNoegle: "jitsujagt-v2",
  spilId: "jitsujagt"
};

/* ---------- materialerne ----------
   Hvert materiale er ét verbum. Det er dem, der laver kæderne — og
   fordi de tre kædetyper har modsatrettede forudsætninger (fald kræver
   højde, sprængning kræver vægt ovenpå, stød kræver en ubrudt søjle),
   kan man aldrig få dem alle tre. Det er hele beslutningen.        */
const TOM = 0, STEN = 1, TRAE = 2, IS = 3, JERN = 4, LED = 5;
const MAT = {
  1: { navn: "Sten",  hp: 2, farve: "#8d99ae", kant: "#5c6678", tegn: "" },
  2: { navn: "Træ",   hp: 1, farve: "#c68642", kant: "#8a5a2b", tegn: "" },
  3: { navn: "Is",    hp: 1, farve: "#7ee0ff", kant: "#3f9ec4", tegn: "" },
  4: { navn: "Jern",  hp: 9, farve: "#5a6270", kant: "#343a44", tegn: "" },
  5: { navn: "Led",   hp: 1, farve: "#ffd43b", kant: "#c9a21a", tegn: "" }
};
const MAT_FORKLARING = {
  1: "Tåler to slag. Gør ikke andet.",
  2: "Splintrer langs sin årering — hele vejen gennem træ.",
  3: "Sprænger til alle fire naboer, men kun med vægt ovenpå.",
  4: "Kan ikke slås i stykker. Sender stødet lige ned.",
  5: "Bærer alt over sig. Går det, revner hele søjlen."
};

/* ---------- reglerne ----------
   Rene funktioner: tilstand ind, tilstand ud. Det er ikke pynt — de
   bruges tre steder med præcis samme adfærd: i spillet, i previewet,
   der viser hvad et slag gør, og i generatorens søgning efter par.  */
const idx = (s, x, y) => y * s.b + x;
const inde = (s, x, y) => x >= 0 && x < s.b && y >= 0 && y < s.h;

/* Hver celle har et id, der følger med, når den falder. Uden det kan
   forhåndsvisningen ikke skelne en celle, der blev ØDELAGT, fra en, der
   bare gled en række ned — og så ville halvdelen af strukturen se ud til
   at forsvinde ved hvert eneste slag.                                  */
function klon(s) {
  return { b: s.b, h: s.h, mat: Int8Array.from(s.mat), hp: Int8Array.from(s.hp),
           fiber: Int8Array.from(s.fiber), skjult: Int8Array.from(s.skjult),
           id: Int32Array.from(s.id) };
}

function ram(s, x, y, koe) {
  if (!inde(s, x, y)) return;
  const i = idx(s, x, y);
  const m = s.mat[i];
  if (m === TOM) return;
  if (m === JERN) { ram(s, x, y + 1, koe); return; }   // stødet går igennem jernet
  s.skjult[i] = 0;
  if (--s.hp[i] <= 0) koe.push([x, y]);
}

function bryd(s, x, y, koe) {
  const i = idx(s, x, y);
  const m = s.mat[i];
  if (m === TOM) return;
  const vaegtOvenpaa = inde(s, x, y - 1) && s.mat[idx(s, x, y - 1)] !== TOM;
  const fiber = s.fiber[i];
  s.mat[i] = TOM; s.hp[i] = 0; s.skjult[i] = 0; s.id[i] = 0;

  if (m === TRAE) {
    const retninger = fiber ? [[0, -1], [0, 1]] : [[-1, 0], [1, 0]];
    for (const [dx, dy] of retninger) {
      let cx = x + dx, cy = y + dy;
      while (inde(s, cx, cy) && s.mat[idx(s, cx, cy)] === TRAE) {
        ram(s, cx, cy, koe);
        cx += dx; cy += dy;
      }
    }
  } else if (m === IS) {
    if (vaegtOvenpaa)
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) ram(s, x + dx, y + dy, koe);
  } else if (m === LED) {
    // bæringen knækker: hele søjlen ovenover revner
    for (let cy = y - 1; cy >= 0; cy--) {
      if (s.mat[idx(s, x, cy)] === TOM) break;
      ram(s, x, cy, koe);
    }
  }
  afdaek(s, x, y);
}

/* En skjult celle røbes, når naboen forsvinder. */
function afdaek(s, x, y) {
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    if (!inde(s, x + dx, y + dy)) continue;
    const j = idx(s, x + dx, y + dy);
    if (s.mat[j] !== TOM) s.skjult[j] = 0;
  }
}

function fald(s, koe) {
  let noget = false;
  for (let x = 0; x < s.b; x++) {
    let skriv = s.h - 1;
    for (let y = s.h - 1; y >= 0; y--) {
      const i = idx(s, x, y);
      if (s.mat[i] === TOM) continue;
      if (skriv !== y) {
        const j = idx(s, x, skriv);
        s.mat[j] = s.mat[i]; s.hp[j] = s.hp[i];
        s.fiber[j] = s.fiber[i]; s.skjult[j] = s.skjult[i]; s.id[j] = s.id[i];
        s.mat[i] = TOM; s.hp[i] = 0; s.skjult[i] = 0; s.id[i] = 0;
        noget = true;
        if (skriv - y >= 2) { ram(s, x, skriv, koe); ram(s, x, skriv + 1, koe); }
      }
      skriv--;
    }
  }
  return noget;
}

/* Teknikkerne er verber, ikke tal. De ændrer HVOR stødet lander —
   aldrig hvor hårdt det slår. Derfor kan en opgradering ikke gøre
   puslespillet irrelevant, kun give flere måder at løse det på.    */
const TEKNIK = {
  stoed:     { navn: "Stød",       fokus: 0, brug: 0, pris: 0,      tegn: "✊",
               tekst: "Ét slag på én celle" },
  knus:      { navn: "Knus",       fokus: 2, brug: 2, pris: 250,    tegn: "🪨",
               tekst: "To slag på samme celle" },
  nedslag:   { navn: "Nedslag",    fokus: 2, brug: 2, pris: 900,    tegn: "⬇",
               tekst: "Rammer cellen og den under den" },
  sidespark: { navn: "Sidespark",  fokus: 3, brug: 1, pris: 3500,   tegn: "↔",
               tekst: "Rammer hele rækken" },
  lodret:    { navn: "Lodret stød",fokus: 3, brug: 1, pris: 12000,  tegn: "↕",
               tekst: "Rammer hele søjlen nedad" },
  roentgen:  { navn: "Røntgen",    fokus: 2, brug: 1, pris: 40000,  tegn: "👁",
               tekst: "Afslører fire skjulte celler — koster ikke et slag" },
  efterslag: { navn: "Efterslag",  fokus: 3, brug: 0, pris: 150000, tegn: "↺",
               tekst: "Rydder et slag fem celler, er slaget gratis" },
  tyngde:    { navn: "Tyngde",     fokus: 2, brug: 0, pris: 500000, tegn: "⚓",
               tekst: "Fald på ét felt gør også skade" }
};
const TEKNIK_ORDEN = ["stoed", "knus", "nedslag", "sidespark", "lodret", "roentgen", "efterslag", "tyngde"];

/* Ét slag, kørt helt til bunds. Returnerer den nye tilstand.
   `passiv` er de udrustede passive teknikker, som ændrer fysikken.  */
function udfoerSlag(s0, x, y, teknik, passiv) {
  const s = klon(s0);
  const koe = [];
  passiv = passiv || {};
  if (teknik === "roentgen") { roentgen(s); return s; }

  if (teknik === "sidespark") for (let cx = 0; cx < s.b; cx++) ram(s, cx, y, koe);
  else if (teknik === "lodret") for (let cy = y; cy < s.h; cy++) ram(s, x, cy, koe);
  else if (teknik === "nedslag") { ram(s, x, y, koe); ram(s, x, y + 1, koe); }
  else if (teknik === "knus") { ram(s, x, y, koe); ram(s, x, y, koe); }
  else ram(s, x, y, koe);

  for (let vagt = 0; vagt < 400; vagt++) {
    while (koe.length) {
      const [bx, by] = koe.shift();
      if (s.mat[idx(s, bx, by)] !== TOM) bryd(s, bx, by, koe);
    }
    if (!faldMed(s, koe, passiv.tyngde)) break;
    if (!koe.length) break;
  }
  return s;
}

function faldMed(s, koe, tyngde) {
  if (!tyngde) return fald(s, koe);
  // tyngde: også et fald på ét felt gør skade
  let noget = false;
  for (let x = 0; x < s.b; x++) {
    let skriv = s.h - 1;
    for (let y = s.h - 1; y >= 0; y--) {
      const i = idx(s, x, y);
      if (s.mat[i] === TOM) continue;
      if (skriv !== y) {
        const j = idx(s, x, skriv);
        s.mat[j] = s.mat[i]; s.hp[j] = s.hp[i];
        s.fiber[j] = s.fiber[i]; s.skjult[j] = s.skjult[i]; s.id[j] = s.id[i];
        s.mat[i] = TOM; s.hp[i] = 0; s.skjult[i] = 0; s.id[i] = 0;
        noget = true;
        ram(s, x, skriv, koe); ram(s, x, skriv + 1, koe);
      }
      skriv--;
    }
  }
  return noget;
}

function roentgen(s) {
  let n = 0;
  for (let i = 0; i < s.mat.length && n < 4; i++)
    if (s.skjult[i]) { s.skjult[i] = 0; n++; }
}

const ryddet = s => { for (let i = 0; i < s.mat.length; i++) if (s.mat[i] !== TOM) return false; return true; };
const fyldte = s => { let n = 0; for (let i = 0; i < s.mat.length; i++) if (s.mat[i] !== TOM) n++; return n; };
const restHP = s => { let n = 0; for (let i = 0; i < s.mat.length; i++) if (s.mat[i] !== TOM) n += Math.min(s.hp[i], 3); return n; };

/* Lovlige mål for et grundslag. Jern kan rammes, men kun hvis stødet
   har noget at ramme længere nede.                                  */
function maal(s) {
  const ud = [];
  for (let y = 0; y < s.h; y++) for (let x = 0; x < s.b; x++) {
    const m = s.mat[idx(s, x, y)];
    if (m === TOM) continue;
    if (m === JERN) {
      let cy = y + 1;
      while (inde(s, x, cy) && s.mat[idx(s, x, cy)] === JERN) cy++;
      if (!inde(s, x, cy) || s.mat[idx(s, x, cy)] === TOM) continue;
    }
    ud.push([x, y]);
  }
  return ud;
}
</script>
<script>
"use strict";

/* ---------- worlds ----------
   Materialerne kommer ét ad gangen, og hvert nyt materiale bliver
   introduceret i en world, hvor gitteret er lille nok til at man kan
   se, hvad det gør.                                                 */
const WORLDS = [
  ["Havedojoen",     "#12204a", "#1d3a6e", "#7ee0ff"],
  ["Bambuslunden",   "#12331f", "#1d5a33", "#9ae66e"],
  ["Kirsebærbakken", "#3a1330", "#6e1f52", "#ff9ecd"],
  ["Rismarken",      "#33300f", "#5e5719", "#ffe066"],
  ["Tågebroen",      "#1a2430", "#334758", "#c5d6e0"],
  ["Stenhaven",      "#241f1c", "#463b34", "#d9b48f"],
  ["Vandfaldet",     "#0e2f3a", "#166173", "#66e0e6"],
  ["Isdojoen",       "#132a44", "#1f5488", "#a5e8ff"],
  ["Vulkanstien",    "#3a1206", "#7a2a0d", "#ff9052"],
  ["Skyggeskoven",   "#160f26", "#2d1f4a", "#a892ff"],
  ["Ørkentemplet",   "#3d2c0c", "#7a5a19", "#ffd07a"],
  ["Tordenbjerget",  "#101a33", "#243a6b", "#8fb6ff"],
  ["Sølvsøen",       "#1c2830", "#38505e", "#dbe9f0"],
  ["Dragehulen",     "#2c0a14", "#5e162a", "#ff6b8a"],
  ["Måneporten",     "#131539", "#262a6b", "#c9c6ff"],
  ["Stjernetrappen", "#0c1030", "#1a205e", "#9ecbff"],
  ["Krystalgrotten", "#0f2b33", "#1d5563", "#7ff0d8"],
  ["Skyhavet",       "#1b2a4a", "#33518f", "#bcd8ff"],
  ["Solpaladset",    "#402a06", "#8a5a0e", "#ffc94d"],
  ["Tomrummet",      "#0a0a14", "#1c1c2e", "#e6e6ff"]
];
const ROMER = ["", "", " II", " III", " IV", " V", " VI", " VII", " VIII", " IX", " X"];
const worldData = w => WORLDS[(w - 1) % WORLDS.length];
function worldNavn(w) {
  const runde = Math.floor((w - 1) / WORLDS.length) + 1;
  return worldData(w)[0] + (ROMER[runde] || " ×" + runde);
}

/* Hvilke materialer findes i en world, og hvor stort er gitteret. */
function worldOpskrift(w) {
  /* Gitteret har et loft. En blok skal blive ved med at være 5-12
     beslutninger — ikke 20. Dybere worlds betaler mere og blander
     materialerne hårdere; de bliver ikke bare større.                  */
  const b = Math.min(6, 4 + Math.floor((w - 1) / 6));
  const h = Math.min(6, 4 + Math.floor((w - 1) / 4));
  /* Is og led kommer tidligt med vilje: de er kædematerialerne, og uden
     dem er en blok bare ét slag pr. celle. Den første world skal vise
     spillets bedste idé, ikke gemme den til world 7.                   */
  const vaegte = [[STEN, 24], [TRAE, 22], [TOM, 18], [IS, 16]];
  if (w >= 2) vaegte.push([LED, 12]);
  if (w >= 4) vaegte.push([JERN, 8]);
  const skjult = w >= 8 ? Math.min(0.30, 0.06 * (w - 7)) : 0;
  /* Par vokser med worlden. Uden det loft bliver den allerførste blok et
     ti-slags stykke arbejde, og spillets bedste idé — kæden — når aldrig
     at vise sig, før man er træt af den.                                */
  const parMaks = Math.min(12, 5 + w);
  return { b, h, vaegte, skjult, parMaks };
}
function nyeMaterialer(w) {
  if (w === 2) return LED;
  if (w === 4) return JERN;
  return 0;
}

const BAELTER = [
  ["Hvidt", "#f1f3f5"], ["Gult", "#ffd43b"], ["Orange", "#ff922b"],
  ["Grønt", "#51cf66"], ["Blåt", "#4dabf7"], ["Lilla", "#b197fc"],
  ["Brunt", "#a1663a"], ["Rødt", "#ff6b6b"], ["Sort", "#343a40"],
  ["Guld", "#f0c419"], ["Diamant", "#8ce8ff"], ["Regnbue", "#ff8fd1"]
];

/* ---------- generatoren ----------
   Den vigtigste regel i hele spillet står her: en struktur bliver kun
   godkendt, hvis GRÅDIGT SPIL ER DÅRLIGERE END OPTIMALT. Ellers er
   der ingen beslutning i blokken, og så kasseres den. Det er den
   samme slags kontrakt som Klodsjagts fairness-regel — bare vendt om:
   dér sikrede den, at brættet kunne løses; her sikrer den, at det
   ikke kan løses uden at tænke.                                     */
function tilfaeldigStruktur(w, r) {
  const o = worldOpskrift(w);
  const sum = o.vaegte.reduce((a, v) => a + v[1], 0);
  const n = o.b * o.h;
  const s = { b: o.b, h: o.h, mat: new Int8Array(n), hp: new Int8Array(n),
              fiber: new Int8Array(n), skjult: new Int8Array(n), id: new Int32Array(n) };
  for (let i = 0; i < n; i++) {
    s.id[i] = i + 1;
    let x = r() * sum, valgt = STEN;
    for (const [t, v] of o.vaegte) { x -= v; if (x <= 0) { valgt = t; break; } }
    s.mat[i] = valgt;
    s.hp[i] = valgt === TOM ? 0 : MAT[valgt].hp;
    s.fiber[i] = r() < 0.5 ? 0 : 1;
  }
  const efter = udfoerSlag(s, -1, -1, "ingen", {});   // lad tyngdekraften sætte sig
  if (o.skjult > 0)
    for (let i = 0; i < n; i++)
      if (efter.mat[i] !== TOM && r() < o.skjult) efter.skjult[i] = 1;
  return efter;
}

const noegle = s => { let k = ""; for (let i = 0; i < s.mat.length; i++) k += s.mat[i] + "" + (s.hp[i] || 0); return k; };

/* Par: bedste antal grundslag, fundet med beam-søgning. Den behøver
   ikke være matematisk optimal — den skal være en fair målestok, og
   en beam, der rammer lidt for højt, gør kun budgettet en anelse
   mildere. Det er den rigtige vej at fejle.                          */
function findPar(s0, bredde, dybde) {
  if (ryddet(s0)) return 0;
  let lag = [s0];
  for (let d = 1; d <= dybde; d++) {
    const naeste = [];
    for (const s of lag)
      for (const [x, y] of maal(s)) {
        const e = udfoerSlag(s, x, y, "stoed", {});
        if (ryddet(e)) return d;
        naeste.push(e);
      }
    if (!naeste.length) return null;
    naeste.sort((a, b) => (fyldte(a) - fyldte(b)) || (restHP(a) - restHP(b)));
    const valgt = [], set = new Set();
    for (const e of naeste) {
      const k = noegle(e);
      if (set.has(k)) continue;
      set.add(k); valgt.push(e);
      if (valgt.length >= bredde) break;
    }
    lag = valgt;
  }
  return null;
}

/* Hvad den naive spiller bruger: ryd flest celler lige nu. */
function graadigtAntal(s0, loft) {
  let s = s0, n = 0;
  while (!ryddet(s) && n < loft) {
    let bedst = null, bedstV = -1;
    const foer = fyldte(s);
    for (const [x, y] of maal(s)) {
      const e = udfoerSlag(s, x, y, "stoed", {});
      const v = foer - fyldte(e);
      if (v > bedstV) { bedstV = v; bedst = [x, y]; }
    }
    if (!bedst) break;
    s = udfoerSlag(s, bedst[0], bedst[1], "stoed", {});
    n++;
  }
  return ryddet(s) ? n : Infinity;
}

function lavBlok(w, r) {
  const o = worldOpskrift(w);
  const mindst = Math.round(o.b * o.h * 0.55);
  let reserve = null;
  for (let forsoeg = 0; forsoeg < TUNE.genForsoeg; forsoeg++) {
    const s = tilfaeldigStruktur(w, r);
    if (fyldte(s) < mindst) continue;

    /* Først en billig, smal søgning. Den koster en tiendedel af den
       rigtige og luger de fleste strukturer ud. Og den er ikke et gæt:
       finder den en løsning på `grov` slag, er det sande par højst
       `grov`. Er den grådige spiller dårligere end `grov`, er han altså
       med sikkerhed også dårligere end par — og så ER der en beslutning
       i blokken. Først dér er det værd at betale for det præcise tal. */
    const grov = findPar(s, TUNE.beamGrov, TUNE.beamDybde);
    if (grov === null || grov < 3 || grov > o.parMaks) continue;
    const graadig = graadigtAntal(s, grov + 6);
    if (!reserve) reserve = { s, par: grov, graadig };
    if (graadig <= grov) continue;              // intet at tænke over: kassér

    const par = findPar(s, TUNE.beamBredde, TUNE.beamDybde) || grov;
    if (par < 3 || par > o.parMaks) continue;
    return { s, par, graadig };
  }
  // gav generatoren op, tages den bedste struktur, den nåede at se
  return reserve || { s: tilfaeldigStruktur(w, r), par: 6, graadig: 6 };
}

/* ---------- lyd ---------- */
const lyd = {
  ac: null,
  til: (function () { try { return localStorage.getItem(TUNE.gemNoegle + "-lyd") !== "fra"; } catch (e) { return true; } })(),
  start() {
    if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  },
  tone(frek, laengde, type, styrke, forsink) {
    if (!this.til || !this.ac) return;
    try {
      const t = this.ac.currentTime + (forsink || 0);
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(frek, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(styrke || 0.16, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + laengde);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t); o.stop(t + laengde + 0.05);
    } catch (e) { }
  },
  slag() { this.tone(190, 0.07, "square", 0.07); },
  revne(n) { this.tone(240 + n * 45, 0.09, "triangle", 0.09); },
  fald() { this.tone(110, 0.16, "sawtooth", 0.09); },
  ryd(ren) {
    const g = ren ? [660, 880, 1100, 1320] : [523, 659, 784];
    g.forEach((f, i) => this.tone(f, 0.25, "triangle", 0.13, i * 0.07));
  },
  sprang() { this.tone(150, 0.22, "sawtooth", 0.08); this.tone(110, 0.3, "sine", 0.07, 0.06); },
  koeb() { this.tone(560, 0.09, "triangle", 0.14); this.tone(840, 0.10, "sine", 0.09, 0.05); },
  baelte() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.3, "sine", 0.13, i * 0.08)); },
  rebirth() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.4, "sine", 0.13, i * 0.10)); },
  nej() { this.tone(150, 0.13, "sawtooth", 0.07); },
  skift() {
    this.til = !this.til;
    try { localStorage.setItem(TUNE.gemNoegle + "-lyd", this.til ? "til" : "fra"); } catch (e) { }
    if (this.til) this.tone(660, 0.1, "triangle", 0.14);
  }
};

/* ---------- tilstand ---------- */
let spillerNavn = SPILHAL.spiller();

const S = {
  mynt: 0, world: 1, dybeste: 0, blokIWorld: 0, rebirth: 0, baelte: 0,
  ejer: { stoed: true },        // teknikker man har købt — overlever rebirth
  ekstra: {},                   // købte ekstra brug pr. blok — overlever rebirth
  udrustet: ["stoed"],          // hvad der er med i dette liv
  fokusEkstra: 0,               // permanent fokus fra rebirths
  struktur: null, par: 0, budget: 0, slag: 0, graadig: 0,
  brugt: {}, valgt: "stoed",
  panel: null, sigte: null, forhaand: null, overlever: null, naeste: null,
  partikler: [], tal: [], ryst: 0, tid: 0, besked: null, hint: 0,
  sidsteResultat: null
};

const fokus = () => TUNE.fokusStart + S.baelte * TUNE.fokusPrBaelte + S.fokusEkstra;
const fokusBrugt = () => S.udrustet.reduce((a, id) => a + TEKNIK[id].fokus, 0);
const myntGrund = w => TUNE.myntGrund * Math.pow(TUNE.myntGange, w - 1);
const magt = () => S.rebirth * 1000 + S.dybeste * 10 + S.baelte;
const harPassiv = id => S.udrustet.indexOf(id) >= 0;
const brugTilbage = id => {
  const t = TEKNIK[id];
  if (!t.brug) return Infinity;
  return t.brug + (S.ekstra[id] || 0) - (S.brugt[id] || 0);
};
const passivSaet = () => ({ tyngde: harPassiv("tyngde"), efterslag: harPassiv("efterslag") });
const skjulteFindes = () => S.struktur && S.struktur.skjult.some(v => v === 1);

<script>
"use strict";

/* ---------- beskeder og effekter ---------- */
function sig(tekst, under, farve) { S.besked = { tekst, under: under || "", ur: 2.6, farve: farve || "#ffd43b" }; }
function flyvendeTal(x, y, tekst, farve, stor) {
  S.tal.push({ x, y, tekst, farve, stor: stor || 1, ur: 0.8 });
  if (S.tal.length > 10) S.tal.shift();
}
function skaarer(x, y, farve, antal) {
  for (let i = 0; i < antal; i++) {
    const v = Math.random() * Math.PI * 2, f = 50 + Math.random() * 260;
    S.partikler.push({ x, y, vx: Math.cos(v) * f, vy: Math.sin(v) * f - 70,
                       s: 3 + Math.random() * 7, farve, ur: 0.35 + Math.random() * 0.5,
                       drej: -5 + Math.random() * 10, v: 0 });
  }
  if (S.partikler.length > 180) S.partikler.splice(0, S.partikler.length - 180);
}

/* ---------- at slå ---------- */
function kanBruge(id) {
  if (!S.ejer[id]) return false;
  if (S.udrustet.indexOf(id) < 0) return false;
  if (!TEKNIK[id].brug) return false;              // passive vælges ikke
  return brugTilbage(id) > 0;
}

function slaaPaa(x, y) {
  if (!S.struktur || ryddet(S.struktur)) return;
  const t = S.valgt;
  if (t !== "stoed" && !kanBruge(t)) { lyd.nej(); S.valgt = "stoed"; return; }

  const foer = S.struktur;
  const foerFyldt = fyldte(foer);
  const efter = udfoerSlag(foer, x, y, t, passivSaet());
  const ryddede = foerFyldt - fyldte(efter);

  if (t === "roentgen") {
    S.brugt[t] = (S.brugt[t] || 0) + 1;
    S.struktur = efter;
    S.valgt = "stoed";
    lyd.revne(2);
    sig("Røntgen", "Fire celler afsløret", "#8ce8ff");
    gemSpil();
    return;
  }
  if (ryddede === 0 && efter.hp.every((v, i) => v === foer.hp[i])) { lyd.nej(); return; }

  if (t !== "stoed") S.brugt[t] = (S.brugt[t] || 0) + 1;
  S.valgt = "stoed";

  // efterslag: et slag, der rydder fem celler, er gratis
  const gratis = harPassiv("efterslag") && ryddede >= 5;
  if (!gratis) S.slag++;

  S.struktur = efter;
  S.ryst = Math.min(14, 4 + ryddede * 1.4);
  if (ryddede > 0) {
    lyd.revne(Math.min(6, ryddede));
    if (ryddede >= 4) lyd.fald();
  } else lyd.slag();
  if (gratis) flyvendeTal(L.gitter.x + L.gitter.w / 2, L.gitter.y - 12, "GRATIS SLAG", "#51cf66", 1.1);

  if (ryddet(S.struktur)) blokRyddet();
  else gemSpil();
}

function belonning() {
  const grund = myntGrund(S.world);
  if (S.slag > S.budget) return grund * TUNE.restbetaling;
  const forhold = S.par / Math.max(1, S.slag);
  return grund * Math.min(TUNE.loftBonus, forhold * forhold);
}

function blokRyddet() {
  const mynt = belonning();
  S.mynt += mynt;
  const ren = S.slag <= S.par;
  const indenfor = S.slag <= S.budget;
  S.sidsteResultat = { slag: S.slag, par: S.par, mynt, ren, indenfor };
  lyd.ryd(ren);

  if (S.world > S.dybeste) S.dybeste = S.world;

  // bæltet vindes ved rent arbejde, ikke ved at købe det
  let nytBaelte = false;
  if (ren && S.baelte < BAELTER.length - 1 && S.world >= (S.baelte + 1) * 2) {
    S.baelte++; nytBaelte = true;
    lyd.baelte();
  }

  if (nytBaelte)
    sig(BAELTER[S.baelte][0] + " bælte!", "Ryddet på par — du har ét fokus mere", BAELTER[S.baelte][1]);
  else if (ren) sig("REN TEKNIK", "Ryddet på " + S.slag + " slag — par var " + S.par, "#51cf66");
  else if (indenfor) sig("BLOK RYDDET", S.slag + " slag, par var " + S.par, "#ffd43b");
  else sig("BUDGETTET SPRANG", "Kun " + Math.round(TUNE.restbetaling * 100) + " % af mynterne", "#ff6b6b");

  S.blokIWorld++;
  if (S.blokIWorld >= TUNE.blokkePrWorld) { S.blokIWorld = 0; S.world++; }
  nyBlok();
  gemSpil();
}

let frø = Math.floor(Math.random() * 1e9);
function rng() {
  return () => { frø = (frø * 1664525 + 1013904223) >>> 0; return frø / 4294967296; };
}

/* Blokken til NÆSTE gang laves, mens spilleren tænker over denne. En
   struktur tager 100-300 ms at finde, og det må ikke ses som en frossen
   skærm ved hvert blokskift.                                          */
function forbered() {
  if (S.naeste && S.naeste.w === S.world) return;
  setTimeout(() => {
    try { S.naeste = { w: S.world, blok: lavBlok(S.world, rng()) }; } catch (e) { }
  }, 60);
}

function nyBlok() {
  /* Et nyt materiale bliver introduceret i den world, hvor gitteret
     stadig er lille nok til at man kan se, hvad det gør. */
  const nyt = S.blokIWorld === 0 ? nyeMaterialer(S.world) : 0;
  const b = (S.naeste && S.naeste.w === S.world) ? S.naeste.blok : lavBlok(S.world, rng());
  S.naeste = null;
  S.struktur = b.s;
  S.par = b.par;
  S.graadig = b.graadig || b.par;
  S.budget = b.par + (b.s.skjult.some(v => v === 1) ? TUNE.slackSkjult : TUNE.slack);
  S.slag = 0;
  S.brugt = {};
  S.valgt = "stoed";
  S.sigte = null; S.forhaand = null; S.overlever = null;
  if (nyt) sig("Nyt materiale: " + MAT[nyt].navn, MAT_FORKLARING[nyt], MAT[nyt].farve);
  forbered();
}

/* ---------- butik og udrustning ---------- */
function koebTeknik(id) {
  const t = TEKNIK[id];
  if (S.ejer[id]) { lyd.nej(); return; }
  if (S.mynt < t.pris) { lyd.nej(); sig("Ikke mynter nok", "Der mangler " + tal(t.pris - S.mynt), "#ff6b6b"); return; }
  S.mynt -= t.pris; S.ejer[id] = true;
  lyd.koeb();
  sig(t.navn, t.tekst, "#8ce8ff");
  gemSpil();
}

function ekstraPris(id) {
  const n = S.ekstra[id] || 0;
  if (!TEKNIK[id].brug || n >= 2) return null;
  return Math.round(TEKNIK[id].pris * 4 * Math.pow(4, n));
}
function koebEkstra(id) {
  const p = ekstraPris(id);
  if (p === null || !S.ejer[id]) { lyd.nej(); return; }
  if (S.mynt < p) { lyd.nej(); sig("Ikke mynter nok", "Der mangler " + tal(p - S.mynt), "#ff6b6b"); return; }
  S.mynt -= p; S.ekstra[id] = (S.ekstra[id] || 0) + 1;
  lyd.koeb();
  gemSpil();
}

/* Fokus er hele afvejningen: man kan eje alt og alligevel kun have
   noget af det med. Hvert valg lukker en dør.                       */
function udrust(id) {
  if (!S.ejer[id] || id === "stoed") { lyd.nej(); return; }
  const i = S.udrustet.indexOf(id);
  if (i >= 0) { S.udrustet.splice(i, 1); lyd.koeb(); gemSpil(); return; }
  if (fokusBrugt() + TEKNIK[id].fokus > fokus()) {
    lyd.nej();
    sig("Ikke fokus nok", "Læg noget andet fra dig først", "#ff6b6b");
    return;
  }
  S.udrustet.push(id);
  lyd.koeb();
  gemSpil();
}

function rejsTil(w) {
  if (w < 1 || w > S.dybeste + 1) { lyd.nej(); return; }
  S.world = w; S.blokIWorld = 0;
  nyBlok();
  S.panel = null;
  sig(worldNavn(w), "Blok på " + S.struktur.b + "×" + S.struktur.h + " · par " + S.par, worldData(w)[3]);
  gemSpil();
}

const rebirthGevinst = () => 1 + Math.floor(S.dybeste / TUNE.rebirthDybdeTrin);
const kanRebirth = () => S.dybeste >= 6;

function tagRebirth() {
  if (!kanRebirth()) { lyd.nej(); return; }
  const gevinst = rebirthGevinst();
  S.fokusEkstra += gevinst;
  S.rebirth++;
  S.mynt = 0; S.world = 1; S.dybeste = 0; S.blokIWorld = 0; S.baelte = 0;
  S.udrustet = ["stoed"];
  nyBlok();
  S.panel = null;
  lyd.rebirth();
  sig("REBIRTH " + S.rebirth, "+" + gevinst + " fokus for altid — nu " + fokus(), "#b197fc");
  gemSpil();
}

/* ---------- hukommelse ---------- */
function gemNoegle() { return TUNE.gemNoegle + "." + (spillerNavn || "Spiller"); }

function gemSpil() {
  try {
    localStorage.setItem(gemNoegle(), JSON.stringify({
      mynt: S.mynt, world: S.world, dybeste: S.dybeste, blokIWorld: S.blokIWorld,
      rebirth: S.rebirth, baelte: S.baelte, ejer: S.ejer, ekstra: S.ekstra,
      udrustet: S.udrustet, fokusEkstra: S.fokusEkstra,
      blok: S.struktur ? {
        b: S.struktur.b, h: S.struktur.h,
        mat: Array.from(S.struktur.mat), hp: Array.from(S.struktur.hp),
        fiber: Array.from(S.struktur.fiber), skjult: Array.from(S.struktur.skjult),
        par: S.par, budget: S.budget, slag: S.slag, brugt: S.brugt
      } : null
    }));
  } catch (e) { }
  SPILHAL.gem(TUNE.spilId, spillerNavn, magt());
}

function hentSpil() {
  let g = null;
  try { g = JSON.parse(localStorage.getItem(gemNoegle()) || "null"); } catch (e) { }
  const heltal = (v, d) => Number.isFinite(v) ? Math.floor(v) : d;
  if (!g) { nulstilAlt(); return false; }
  S.mynt = Number.isFinite(g.mynt) ? Math.max(0, g.mynt) : 0;
  S.world = Math.max(1, heltal(g.world, 1));
  S.dybeste = Math.max(0, heltal(g.dybeste, 0));
  S.blokIWorld = Math.max(0, heltal(g.blokIWorld, 0));
  S.rebirth = Math.max(0, heltal(g.rebirth, 0));
  S.baelte = Math.min(BAELTER.length - 1, Math.max(0, heltal(g.baelte, 0)));
  S.fokusEkstra = Math.max(0, heltal(g.fokusEkstra, 0));
  S.ejer = Object.assign({ stoed: true }, g.ejer || {});
  S.ekstra = g.ekstra || {};
  S.udrustet = Array.isArray(g.udrustet)
    ? g.udrustet.filter(id => TEKNIK[id] && S.ejer[id]) : ["stoed"];
  if (S.udrustet.indexOf("stoed") < 0) S.udrustet.unshift("stoed");
  // udrustningen kan være blevet ulovlig, hvis et gem er ældre end en regelændring
  while (fokusBrugt() > fokus() && S.udrustet.length > 1) S.udrustet.pop();

  const b = g.blok;
  if (b && Array.isArray(b.mat) && b.mat.length === b.b * b.h) {
    S.struktur = { b: b.b, h: b.h, mat: Int8Array.from(b.mat), hp: Int8Array.from(b.hp),
                   fiber: Int8Array.from(b.fiber), skjult: Int8Array.from(b.skjult || []),
                   id: new Int32Array(b.mat.length) };
    if (S.struktur.skjult.length !== b.mat.length) S.struktur.skjult = new Int8Array(b.mat.length);
    for (let i = 0; i < b.mat.length; i++) S.struktur.id[i] = i + 1;   // id'er lever kun i et preview
    S.par = heltal(b.par, 6);
    S.budget = heltal(b.budget, S.par + TUNE.slack);
    S.slag = Math.max(0, heltal(b.slag, 0));
    S.brugt = b.brugt || {};
    if (ryddet(S.struktur)) nyBlok();
  } else nyBlok();
  return true;
}

function nulstilAlt() {
  S.mynt = 0; S.world = 1; S.dybeste = 0; S.blokIWorld = 0; S.rebirth = 0;
  S.baelte = 0; S.fokusEkstra = 0;
  S.ejer = { stoed: true }; S.ekstra = {}; S.udrustet = ["stoed"];
  nyBlok();
}

/* ---------- tal ---------- */
const ENHEDER = ["", " k", " mio", " mia", " bio", " billiard"];
function tal(n) {
  if (!isFinite(n)) return "∞";
  n = Math.floor(n);
  if (n < 1000) return String(n);
  let i = 0, v = n;
  while (v >= 1000 && i < ENHEDER.length - 1) { v /= 1000; i++; }
  if (v >= 1000) return (v / 1000).toExponential(1).replace(".", ",") + "e21";
  const s = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : String(Math.floor(v));
  return s.replace(".", ",").replace(/,0+$/, "") + ENHEDER[i];
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const nu = () => performance.now() / 1000;

<script>
"use strict";

const canvas = document.getElementById("c");
const wrap = document.getElementById("wrap");
const ctx = canvas.getContext("2d");

/* ---------- iOS: head-tags sættes programmatisk ----------
   Bliver siden indlejret i en anden sides <body>, bliver <meta> i markup
   ignoreret — og uden viewport-tagget tegner Safari siden 980 px bred og
   skalerer ned, så alle tryk rammer forkert.                              */
(function iosOpsaetning() {
  const tags = {
    "viewport": "width=device-width,initial-scale=1,maximum-scale=1," +
                "user-scalable=no,viewport-fit=cover",
    "apple-mobile-web-app-capable": "yes",
    "apple-mobile-web-app-status-bar-style": "black-translucent",
    "apple-mobile-web-app-title": "Jitsujagt",
    "mobile-web-app-capable": "yes",
    "theme-color": "#0b1026"
  };
  for (const navn in tags) {
    let m = document.querySelector('meta[name="' + navn + '"]');
    if (!m) { m = document.createElement("meta"); m.name = navn; document.head.appendChild(m); }
    m.content = tags[navn];
  }
  for (const [rel, href] of [["apple-touch-icon", "icon-180.png"], ["icon", "icon-192.png"],
                             ["manifest", "manifest.webmanifest"]]) {
    if (document.querySelector('link[rel="' + rel + '"]')) continue;
    const l = document.createElement("link");
    l.rel = rel; l.href = href;
    document.head.appendChild(l);
  }
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();

function afrundet(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function skrift(str, vaegt) {
  return (vaegt || 700) + " " + Math.round(str) + 'px "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif';
}
function tekst(streng, x, y, str, farve, align, vaegt) {
  ctx.fillStyle = farve; ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  ctx.font = skrift(str, vaegt);
  ctx.fillText(streng, x, y);
}
function tekstIBredde(streng, x, y, maks, str, farve, vaegt, align) {
  ctx.font = skrift(str, vaegt);
  const b = ctx.measureText(streng).width;
  if (b > maks && b > 0) str = Math.max(8, str * maks / b);
  tekst(streng, x, y, str, farve, align, vaegt);
}

/* ---------- plads på skærmen ---------- */
const L = { w: 0, h: 0, top: 0, bund: 0, gitter: { x: 0, y: 0, w: 0, h: 0, celle: 0 },
            knap: [], teknik: [], faner: [], rader: [], luk: null };

function layout() {
  const cs = getComputedStyle(wrap);
  const w = Math.max(200, wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  const h = Math.max(320, wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  L.w = w; L.h = h;
  L.pad = clamp(Math.min(w, h) * 0.035, 8, 22);
  L.top = clamp(h * 0.155, 88, 152);
  L.teknikH = clamp(h * 0.095, 54, 84);
  L.bund = clamp(h * 0.095, 54, 84);
  const spilH = h - L.top - L.teknikH - L.bund;

  const s = S.struktur || { b: 5, h: 6 };
  const celle = Math.min((w - L.pad * 2) / s.b, (spilH - L.pad * 2) / s.h);
  L.gitter.celle = celle;
  L.gitter.w = celle * s.b;
  L.gitter.h = celle * s.h;
  L.gitter.x = (w - L.gitter.w) / 2;
  L.gitter.y = L.top + (spilH - L.gitter.h) / 2;

  const kr = clamp(L.top * 0.15, 13, 20);
  L.knap = [
    { navn: "lyd", x: w - L.pad - kr, y: L.pad + kr * 0.75, r: kr },
    { navn: "hjem", x: w - L.pad - kr * 3.2, y: L.pad + kr * 0.75, r: kr }
  ];

  // teknikbjælken: kun de aktive, udrustede teknikker
  const aktive = S.udrustet.filter(id => TEKNIK[id].brug || id === "stoed");
  const n = Math.max(1, aktive.length);
  const tw = Math.min((w - L.pad * 2) / n, 96);
  const samlet = tw * n;
  L.teknik = aktive.map((id, i) => ({
    id, x: (w - samlet) / 2 + i * tw + 3, y: h - L.bund - L.teknikH + 6,
    w: tw - 6, h: L.teknikH - 12
  }));

  const fn = ["teknikker", "worlds", "rebirth"];
  const fw = (w - L.pad * 2) / fn.length;
  L.faner = fn.map((navn, i) => ({ navn, x: L.pad + i * fw, y: h - L.bund + 4,
                                   w: fw - 4, h: L.bund - 10 }));
}
addEventListener("resize", layout);
addEventListener("orientationchange", () => setTimeout(layout, 120));
if (window.visualViewport) visualViewport.addEventListener("resize", layout);

/* ---------- baggrund ---------- */
function tegnBaggrund() {
  const d = worldData(S.world);
  const g = ctx.createLinearGradient(0, 0, 0, L.h);
  g.addColorStop(0, d[2]); g.addColorStop(0.6, d[1]); g.addColorStop(1, "#080b1c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, L.w, L.h);
  ctx.globalAlpha = 0.13;
  ctx.fillStyle = d[3];
  ctx.beginPath();
  ctx.arc(L.w * 0.8, L.top + L.h * 0.06, Math.min(L.w, L.h) * 0.09, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------- gitteret ----------
   Revnerne viser resterende liv, årerne viser træets retning, og en
   skjult celle er et spørgsmålstegn. Alt kan læses uden tal.        */
function tegnCelle(x, y, cx, cy, c, alfa, marker) {
  const s = S.struktur, i = idx(s, x, y), m = s.mat[i];
  if (m === TOM) return;
  const skjult = s.skjult[i];
  const d = MAT[m];
  const p = c * 0.055;
  ctx.globalAlpha = alfa;
  afrundet(cx + p, cy + p, c - p * 2, c - p * 2, c * 0.16);
  ctx.fillStyle = skjult ? "#3b4363" : d.farve;
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, c * 0.05);
  ctx.strokeStyle = skjult ? "#5a6288" : d.kant;
  ctx.stroke();

  if (skjult) {
    tekst("?", cx + c / 2, cy + c / 2, c * 0.44, "rgba(255,255,255,.5)", "center", 800);
  } else if (m === TRAE) {                       // årerne: fiberretningen
    ctx.strokeStyle = "rgba(0,0,0,.22)";
    ctx.lineWidth = Math.max(1, c * 0.05);
    for (const f of [0.34, 0.5, 0.66]) {
      ctx.beginPath();
      if (s.fiber[i]) { ctx.moveTo(cx + c * f, cy + p * 2); ctx.lineTo(cx + c * f, cy + c - p * 2); }
      else { ctx.moveTo(cx + p * 2, cy + c * f); ctx.lineTo(cx + c - p * 2, cy + c * f); }
      ctx.stroke();
    }
  } else if (m === JERN) {                       // nitter: stødet går igennem
    ctx.fillStyle = "rgba(255,255,255,.30)";
    for (const [ax, ay] of [[0.3, 0.3], [0.7, 0.3], [0.3, 0.7], [0.7, 0.7]]) {
      ctx.beginPath(); ctx.arc(cx + c * ax, cy + c * ay, c * 0.055, 0, Math.PI * 2); ctx.fill();
    }
  } else if (m === LED) {                        // leddet: en bærende bolt
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ctx.lineWidth = Math.max(1.5, c * 0.07);
    ctx.beginPath(); ctx.arc(cx + c / 2, cy + c / 2, c * 0.20, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + c * 0.5, cy + p * 2); ctx.lineTo(cx + c * 0.5, cy + c * 0.3); ctx.stroke();
  } else if (m === IS) {
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = Math.max(1, c * 0.045);
    ctx.beginPath();
    ctx.moveTo(cx + c * 0.28, cy + c * 0.7); ctx.lineTo(cx + c * 0.5, cy + c * 0.26);
    ctx.lineTo(cx + c * 0.72, cy + c * 0.66);
    ctx.stroke();
  }

  // revner: sten har to liv, og det skal kunne ses
  if (!skjult && s.hp[i] < d.hp && m !== JERN) {
    ctx.strokeStyle = "rgba(10,12,30,.55)";
    ctx.lineWidth = Math.max(1.5, c * 0.055);
    ctx.beginPath();
    ctx.moveTo(cx + c * 0.24, cy + c * 0.2); ctx.lineTo(cx + c * 0.46, cy + c * 0.52);
    ctx.lineTo(cx + c * 0.3, cy + c * 0.78);
    ctx.stroke();
  }
  if (marker) {
    afrundet(cx + p, cy + p, c - p * 2, c - p * 2, c * 0.16);
    ctx.strokeStyle = marker; ctx.lineWidth = Math.max(2.5, c * 0.09); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function tegnGitter() {
  const s = S.struktur;
  if (!s) return;
  const c = L.gitter.celle, gx = L.gitter.x, gy = L.gitter.y;

  // gulvet under strukturen
  ctx.fillStyle = "rgba(255,255,255,.06)";
  afrundet(gx - 6, gy - 6, L.gitter.w + 12, L.gitter.h + 12, 14);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.lineWidth = 1; ctx.stroke();

  const f = S.forhaand;
  for (let y = 0; y < s.h; y++) for (let x = 0; x < s.b; x++) {
    const i = idx(s, x, y);
    if (s.mat[i] === TOM) continue;
    let alfa = 1, marker = null;
    if (f && S.overlever && !S.overlever.has(s.id[i])) alfa = 0.30;   // ødelægges af slaget
    if (S.sigte && S.sigte.x === x && S.sigte.y === y) marker = "#ffffff";
    tegnCelle(x, y, gx + x * c, gy + y * c, c, alfa, marker);
  }

  // sigtelinjer for de teknikker, der rammer mere end én celle
  if (S.sigte && S.valgt !== "stoed") {
    ctx.globalAlpha = 0.22; ctx.fillStyle = "#ffffff";
    if (S.valgt === "sidespark") ctx.fillRect(gx, gy + S.sigte.y * c, L.gitter.w, c);
    if (S.valgt === "lodret") ctx.fillRect(gx + S.sigte.x * c, gy + S.sigte.y * c, c, L.gitter.h - S.sigte.y * c);
    if (S.valgt === "nedslag") ctx.fillRect(gx + S.sigte.x * c, gy + S.sigte.y * c, c, c * 2);
    ctx.globalAlpha = 1;
  }

  if (f) {
    const vaek = fyldte(s) - fyldte(f);
    if (vaek > 0) {
      const bx = gx + L.gitter.w / 2, by = gy - clamp(c * 0.45, 14, 26);
      tekst("−" + vaek + (vaek === 1 ? " celle" : " celler"), bx, by, clamp(c * 0.36, 13, 20), "#ffd43b", "center", 800);
    }
  }
}

/* Hvilke celler overlever slaget? Sættet bruges kun af forhåndsvisningen. */
function overlevende(f) {
  const set = new Set();
  for (let i = 0; i < f.id.length; i++) if (f.mat[i] !== TOM) set.add(f.id[i]);
  return set;
}

<script>
"use strict";

/* ---------- HUD ---------- */
function tegnHUD() {
  const pad = L.pad, kr = L.knap[0].r;
  /* Fire faste rækker. Uden dem lagde møntbeløbet sig oven i world-navnet,
     så snart skærmen blev lav.                                          */
  const r1 = pad + 11, r2 = pad + 39, r3 = L.top - 27, r4 = L.top - 11;
  const knapVenstre = L.knap[L.knap.length - 1].x - kr * 1.6;

  tekst("MYNTER", pad, r1, clamp(L.top * 0.09, 9, 12), "rgba(255,255,255,.45)", "left", 700);

  // slagtælleren er spillets vigtigste tal: budgettet er hele indsatsen
  const overPar = S.slag > S.par, overBudget = S.slag > S.budget;
  const f = overBudget ? "#ff6b6b" : overPar ? "#ffd43b" : "#51cf66";
  const s1 = clamp(L.top * 0.17, 14, 22);
  ctx.font = skrift(s1, 800);
  const txt = "SLAG " + S.slag + " / " + S.budget;
  const bw = ctx.measureText(txt).width + s1 * 1.1;
  afrundet(L.w - pad - bw, r2 - s1 * 0.85, bw, s1 * 1.7, s1 * 0.85);
  ctx.fillStyle = overBudget ? "rgba(255,107,107,.20)" : "rgba(255,255,255,.09)";
  ctx.fill();
  tekst(txt, L.w - pad - bw / 2, r2, s1, f, "center", 800);
  tekst("par " + S.par, L.w - pad - bw / 2, r2 + s1 * 1.25, clamp(L.top * 0.09, 9, 12),
    "rgba(255,255,255,.55)", "center", 700);

  tekstIBredde(tal(S.mynt), pad, r2, L.w - bw - pad * 3,
    clamp(L.top * 0.19, 16, 24), "#ffd43b", 800, "left");

  tekstIBredde(worldNavn(S.world), pad, r3, L.w - pad * 2,
    clamp(L.top * 0.12, 11, 16), "#ffffff", 800, "left");
  const linje = "World " + S.world + "  ·  " + BAELTER[S.baelte][0].toLowerCase() + " bælte" +
                "  ·  fokus " + fokusBrugt() + "/" + fokus() +
                (S.rebirth ? "  ·  rebirth " + S.rebirth : "");
  tekstIBredde(linje, pad, r4, L.w - pad * 2,
    clamp(L.top * 0.085, 9, 11), "rgba(255,255,255,.52)", 700, "left");

  for (const k of L.knap) {
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.fill();
    if (k.navn === "lyd") {
      tekst("♪", k.x, k.y + k.r * 0.04, k.r * 1.25, lyd.til ? "#ffffff" : "rgba(255,255,255,.35)", "center", 700);
      if (!lyd.til) {
        ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = Math.max(1.5, k.r * 0.12);
        ctx.beginPath(); ctx.moveTo(k.x - k.r * 0.55, k.y + k.r * 0.55);
        ctx.lineTo(k.x + k.r * 0.55, k.y - k.r * 0.55); ctx.stroke();
      }
    } else tekst("⌂", k.x, k.y + k.r * 0.02, k.r * 1.35, "#ffffff", "center", 700);
  }
}

/* ---------- teknikbjælken ---------- */
function tegnTeknik() {
  for (const b of L.teknik) {
    const t = TEKNIK[b.id];
    const valgt = S.valgt === b.id;
    const rest = brugTilbage(b.id);
    const brugbar = b.id === "stoed" || rest > 0;
    afrundet(b.x, b.y, b.w, b.h, 14);
    ctx.fillStyle = valgt ? "rgba(255,212,59,.22)" : brugbar ? "rgba(255,255,255,.09)" : "rgba(255,255,255,.04)";
    ctx.fill();
    if (valgt) { ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 2; ctx.stroke(); }
    const a = brugbar ? 1 : 0.35;
    ctx.globalAlpha = a;
    tekst(t.tegn, b.x + b.w / 2, b.y + b.h * 0.34, b.h * 0.34, "#ffffff", "center", 700);
    tekstIBredde(t.navn, b.x + b.w / 2, b.y + b.h * 0.68, b.w - 8, b.h * 0.19,
      valgt ? "#ffd43b" : "rgba(255,255,255,.75)", 800);
    if (t.brug) tekst(String(rest), b.x + b.w - 10, b.y + 11, b.h * 0.18,
      rest > 0 ? "#51cf66" : "rgba(255,255,255,.3)", "center", 800);
    ctx.globalAlpha = 1;
  }
}

/* ---------- fanerne ---------- */
function noget(fane) {
  if (fane === "teknikker")
    return TEKNIK_ORDEN.some(id => !S.ejer[id] && S.mynt >= TEKNIK[id].pris) ||
           TEKNIK_ORDEN.some(id => S.ejer[id] && S.udrustet.indexOf(id) < 0 &&
                                   fokusBrugt() + TEKNIK[id].fokus <= fokus());
  if (fane === "worlds") return S.dybeste >= 1;
  if (fane === "rebirth") return kanRebirth();
  return false;
}
function tegnFaner() {
  const navne = { teknikker: "TEKNIKKER", worlds: "WORLDS", rebirth: "REBIRTH" };
  ctx.fillStyle = "rgba(8,11,32,.72)";
  ctx.fillRect(0, L.h - L.bund, L.w, L.bund);
  for (const f of L.faner) {
    const aaben = S.panel === f.navn;
    afrundet(f.x, f.y, f.w, f.h, 14);
    ctx.fillStyle = aaben ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.07)";
    ctx.fill();
    tekstIBredde(navne[f.navn], f.x + f.w / 2, f.y + f.h / 2, f.w - 10, clamp(f.w * 0.13, 9, 13),
      aaben ? "#ffffff" : "rgba(255,255,255,.72)", 800);
    if (noget(f.navn) && !aaben) {
      ctx.beginPath(); ctx.arc(f.x + f.w - 11, f.y + 11, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffd43b"; ctx.fill();
    }
  }
}

/* ---------- panelerne ---------- */
function panelKort(overskrift, under) {
  const y0 = L.top, hh = L.h - L.top - L.bund;
  ctx.fillStyle = "rgba(6,9,24,.88)"; ctx.fillRect(0, y0, L.w, hh);
  const x = L.pad, y = y0 + 6, w = L.w - L.pad * 2, h = hh - 12;
  afrundet(x, y, w, h, 20);
  ctx.fillStyle = "#141c44"; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1; ctx.stroke();
  const os = clamp(h * 0.05, 14, 19);
  tekst(overskrift, x + w / 2, y + os * 1.5, os, "#ffffff", "center", 800);
  let indre = y + os * 2.7;
  if (under) {
    tekstIBredde(under, x + w / 2, indre, w - 30, clamp(h * 0.033, 10, 13), "rgba(255,255,255,.6)", 700);
    indre += clamp(h * 0.045, 13, 18);
  }
  const lr = clamp(h * 0.04, 13, 17);
  L.luk = { x: x + w - lr - 12, y: y + lr + 10, r: lr };
  ctx.beginPath(); ctx.arc(L.luk.x, L.luk.y, lr, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.fill();
  tekst("✕", L.luk.x, L.luk.y + 1, lr * 1.05, "rgba(255,255,255,.8)", "center", 800);
  return { x: x + 12, y: indre, w: w - 24, h: y + h - indre - 12 };
}

function panelTeknikker() {
  const k = panelKort("TEKNIKKER",
    "Fokus " + fokusBrugt() + " af " + fokus() + " brugt — du kan eje alt, men ikke bære alt");
  const n = TEKNIK_ORDEN.length;
  const luft = 5;
  const rh = Math.min(74, (k.h - luft * (n - 1)) / n);
  TEKNIK_ORDEN.forEach((id, i) => {
    const t = TEKNIK[id];
    const ry = k.y + i * (rh + luft);
    const ejet = !!S.ejer[id], paa = S.udrustet.indexOf(id) >= 0;
    afrundet(k.x, ry, k.w, rh, 12);
    ctx.fillStyle = paa ? "rgba(81,207,102,.12)" : "rgba(255,255,255,.06)"; ctx.fill();
    if (paa) { ctx.strokeStyle = "rgba(81,207,102,.5)"; ctx.lineWidth = 1.5; ctx.stroke(); }

    const kb = Math.min(k.w * 0.34, 112), kh = rh - 14;
    const kx = k.x + k.w - kb - 8, ky = ry + 7;
    tekst(t.tegn, k.x + 14, ry + rh * 0.5, rh * 0.34, ejet ? "#ffffff" : "rgba(255,255,255,.4)", "left", 700);
    tekstIBredde(t.navn + (t.fokus ? "  ·  " + t.fokus + " fokus" : ""),
      k.x + 44, ry + rh * 0.33, k.w - kb - 60, clamp(rh * 0.22, 11, 15),
      ejet ? "#ffffff" : "rgba(255,255,255,.55)", 800, "left");
    const brugTekst = t.brug ? "  ·  " + (t.brug + (S.ekstra[id] || 0)) + "× pr. blok" : "  ·  passiv";
    tekstIBredde(t.tekst + (id === "stoed" ? "" : brugTekst), k.x + 44, ry + rh * 0.67,
      k.w - kb - 60, clamp(rh * 0.165, 9, 12), "rgba(255,255,255,.5)", 700, "left");

    let etiket, bagg, farve, handling;
    if (!ejet) {
      const raad = S.mynt >= t.pris;
      etiket = tal(t.pris); bagg = raad ? "#37b24d" : "rgba(255,255,255,.10)";
      farve = raad ? "#fff" : "rgba(255,255,255,.5)";
      handling = { type: "koeb", id };
    } else if (id === "stoed") {
      etiket = "ALTID MED"; bagg = "rgba(81,207,102,.18)"; farve = "#51cf66"; handling = null;
    } else if (paa) {
      etiket = "LÆG FRA"; bagg = "rgba(255,255,255,.12)"; farve = "#fff";
      handling = { type: "udrust", id };
    } else {
      const plads = fokusBrugt() + t.fokus <= fokus();
      etiket = plads ? "TAG MED" : "FOR TUNGT";
      bagg = plads ? "#4dabf7" : "rgba(255,255,255,.06)";
      farve = plads ? "#fff" : "rgba(255,255,255,.35)";
      handling = plads ? { type: "udrust", id } : null;
    }
    afrundet(kx, ky, kb, kh, kh / 2);
    ctx.fillStyle = bagg; ctx.fill();
    tekstIBredde(etiket, kx + kb / 2, ky + kh / 2, kb - 12, clamp(kh * 0.36, 10, 14), farve, 800);
    if (handling) L.rader.push({ x: kx - 6, y: ry, w: kb + 14, h: rh, handling });

    // lille knap til et ekstra brug pr. blok — den lange møntbrønd
    const ep = ejet && id !== "stoed" ? ekstraPris(id) : null;
    if (ep !== null) {
      const sb = Math.min(64, k.w * 0.2), sy = ry + rh - 20;
      afrundet(k.x + 44, sy - 8, sb, 17, 8);
      ctx.fillStyle = S.mynt >= ep ? "rgba(77,171,247,.28)" : "rgba(255,255,255,.06)"; ctx.fill();
      tekstIBredde("+1 brug " + tal(ep), k.x + 44 + sb / 2, sy, sb - 6, 9.5,
        S.mynt >= ep ? "#cfe8ff" : "rgba(255,255,255,.35)", 700);
      L.rader.push({ x: k.x + 44, y: sy - 9, w: sb, h: 19, handling: { type: "ekstra", id } });
    }
  });
}

function panelWorlds() {
  const k = panelKort("WORLDS", "Dybere world giver flere mynter — og hårdere strukturer");
  const foerste = Math.max(1, S.dybeste + 1 - 29);
  const antal = S.dybeste + 1 - foerste + 1;
  const kol = 5, raek = Math.ceil(antal / kol);
  const tw = (k.w - (kol - 1) * 6) / kol;
  const th = Math.min(tw, (k.h - (raek - 1) * 6) / Math.max(1, raek));
  for (let i = 0; i < antal; i++) {
    const w = foerste + i;
    const tx = k.x + (i % kol) * (tw + 6), ty = k.y + Math.floor(i / kol) * (th + 6);
    const her = w === S.world;
    afrundet(tx, ty, tw, th, 12);
    ctx.fillStyle = her ? "rgba(255,212,59,.22)" : "rgba(255,255,255,.08)"; ctx.fill();
    if (her) { ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(tx + tw / 2, ty + th * 0.32, Math.max(3, th * 0.10), 0, Math.PI * 2);
    ctx.fillStyle = worldData(w)[3]; ctx.fill();
    tekstIBredde(String(w), tx + tw / 2, ty + th * 0.68, tw - 8, clamp(th * 0.3, 11, 17), "#fff", 800);
    if (!her) L.rader.push({ x: tx, y: ty, w: tw, h: th, handling: { type: "world", w } });
  }
}

function panelRebirth() {
  const kan = kanRebirth();
  const k = panelKort("REBIRTH " + (S.rebirth + 1), "Giv alt fra dig for at kunne bære mere");
  const ls = clamp(k.h * 0.05, 11, 15);
  const linjer = [
    "Du mister:  mynter, bælte, world og din udrustning",
    "Du beholder:  alle teknikker, du har købt",
    "Du får:  fokus, så du kan bære flere teknikker på én gang"
  ];
  // fælles skriftstørrelse: ellers skrumper hver linje for sig og de tre
  // står i tre forskellige størrelser under hinanden
  let ls2 = ls;
  for (const l of linjer) {
    ctx.font = skrift(ls, 700);
    const b = ctx.measureText(l).width;
    if (b > k.w - 8) ls2 = Math.min(ls2, ls * (k.w - 8) / b);
  }
  linjer.forEach((l, i) =>
    tekst(l, k.x + 4, k.y + ls * (1.1 + i * 1.7), ls2, "rgba(255,255,255,.8)", "left", 700));

  /* Her ligger spillets største beslutning: bonussen vokser med dybden,
     så tidlig rebirth mod lidt fokus og sen rebirth mod meget er to
     planer, der begge kan være rigtige.                               */
  const by = k.y + ls * 6.4;
  const kort = [[Math.max(6, S.dybeste), rebirthGevinst()],
                [Math.max(6, S.dybeste) + 8, rebirthGevinst() + 1],
                [Math.max(6, S.dybeste) + 16, rebirthGevinst() + 2]];
  tekstIBredde("Bonussen vokser, jo dybere du når først:", k.x + 4, by, k.w - 8, ls * 0.92,
    "rgba(255,255,255,.6)", 700, "left");
  kort.forEach(([w, g], i) => {
    const rw = (k.w - 12) / 3, rx = k.x + i * (rw + 6), ry = by + ls * 1.1;
    afrundet(rx, ry, rw, ls * 3.1, 10);
    ctx.fillStyle = i === 0 ? "rgba(255,212,59,.16)" : "rgba(255,255,255,.06)"; ctx.fill();
    tekstIBredde("world " + w, rx + rw / 2, ry + ls * 0.95, rw - 8, ls * 0.85, "rgba(255,255,255,.6)", 700);
    tekstIBredde("+" + g + " fokus", rx + rw / 2, ry + ls * 2.15, rw - 8, ls * 1.05,
      i === 0 ? "#ffd43b" : "#fff", 800);
  });

  const kh = Math.max(44, k.h * 0.15), ky = k.y + k.h - kh;
  afrundet(k.x, ky, k.w, kh, kh / 2);
  ctx.fillStyle = kan ? "#7048e8" : "rgba(255,255,255,.08)"; ctx.fill();
  tekstIBredde(kan ? "TAG REBIRTH  ·  +" + rebirthGevinst() + " FOKUS" : "Nå world 6 først",
    k.x + k.w / 2, ky + kh / 2, k.w - 24, clamp(kh * 0.34, 12, 17),
    kan ? "#fff" : "rgba(255,255,255,.45)", 800);
  if (kan) L.rader.push({ x: k.x, y: ky, w: k.w, h: kh, handling: { type: "rebirth" } });
}

function tegnPanel() {
  L.rader = []; L.luk = null;
  if (S.panel === "teknikker") panelTeknikker();
  else if (S.panel === "worlds") panelWorlds();
  else if (S.panel === "rebirth") panelRebirth();
}

<script>
"use strict";

/* ---------- effekter ---------- */
function tegnEffekter() {
  for (const p of S.partikler) {
    ctx.save();
    ctx.globalAlpha = clamp(p.ur * 2, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.v);
    ctx.fillStyle = p.farve;
    afrundet(-p.s / 2, -p.s / 2, p.s, p.s, p.s * 0.25);
    ctx.fill();
    ctx.restore();
  }
  for (const t of S.tal) {
    ctx.save();
    ctx.globalAlpha = clamp(t.ur * 1.6, 0, 1);
    tekst(t.tekst, t.x, t.y - (0.8 - t.ur) * 44, clamp(L.gitter.celle * 0.3 * t.stor, 12, 26),
      t.farve, "center", 800);
    ctx.restore();
  }
}

function tegnBesked() {
  if (!S.besked || S.panel) return;   // et åbent panel har overskriften dér
  const b = S.besked;
  const a = clamp(b.ur > 2.2 ? (2.6 - b.ur) * 5 : b.ur * 1.5, 0, 1);
  const y = L.top + 14;
  const s1 = clamp(L.w * 0.05, 14, 22), s2 = clamp(L.w * 0.032, 10, 14);
  ctx.save();
  ctx.globalAlpha = a;
  afrundet(L.pad, y - s1 * 0.9, L.w - L.pad * 2, s1 * 1.4 + s2 * 1.9, 14);
  ctx.fillStyle = "rgba(8,11,32,.84)"; ctx.fill();
  tekstIBredde(b.tekst, L.w / 2, y + s1 * 0.1, L.w - L.pad * 2 - 24, s1, b.farve, 800);
  if (b.under) tekstIBredde(b.under, L.w / 2, y + s1 * 1.1, L.w - L.pad * 2 - 24, s2,
    "rgba(255,255,255,.72)", 700);
  ctx.restore();
}

function tegnHint() {
  if (S.hint >= 4 || S.panel || S.besked) return;
  const a = clamp((4 - S.hint) / 2.5, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  const y = L.gitter.y + L.gitter.h + clamp(L.gitter.celle * 0.55, 18, 34);
  tekstIBredde("Hold fingeren på en celle — så kan du se, hvad slaget gør",
    L.w / 2, y, L.w * 0.9, clamp(L.w * 0.034, 11, 15), "rgba(255,255,255,.6)", 700);
  ctx.restore();
}

function tegn() {
  tegnBaggrund();
  ctx.save();
  if (S.ryst > 0.2) ctx.translate((Math.random() - 0.5) * S.ryst * 0.7, (Math.random() - 0.5) * S.ryst * 0.7);
  tegnGitter();
  ctx.restore();
  tegnEffekter();
  tegnHint();
  tegnHUD();
  tegnTeknik();
  tegnFaner();
  if (S.panel) tegnPanel(); else { L.rader = []; L.luk = null; }
  tegnBesked();
}

let gemUr = 0;
function opdater(dt) {
  S.tid += dt;
  S.ryst = Math.max(0, S.ryst - dt * 30);
  for (let i = S.partikler.length - 1; i >= 0; i--) {
    const p = S.partikler[i];
    p.ur -= dt;
    if (p.ur <= 0) { S.partikler.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.v += p.drej * dt;
  }
  for (let i = S.tal.length - 1; i >= 0; i--) { S.tal[i].ur -= dt; if (S.tal[i].ur <= 0) S.tal.splice(i, 1); }
  if (S.besked) { S.besked.ur -= dt; if (S.besked.ur <= 0) S.besked = null; }
  gemUr += dt;
  if (gemUr > 8) { gemUr = 0; gemSpil(); }
}

/* ---------- styring ----------
   Hold for at se, slip for at slå. Det er den samme kontrakt som i
   Klodsjagt: man slipper aldrig i blinde.                            */
function punkt(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
const iRundKnap = (p, k) => Math.hypot(p.x - k.x, p.y - k.y) < k.r * 1.7;
const iRekt = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

function celleUnder(p) {
  const s = S.struktur;
  if (!s) return null;
  const c = L.gitter.celle;
  const x = Math.floor((p.x - L.gitter.x) / c), y = Math.floor((p.y - L.gitter.y) / c);
  if (!inde(s, x, y)) return null;
  return maal(s).some(([mx, my]) => mx === x && my === y) ? { x, y } : null;
}

function saetSigte(c) {
  S.sigte = c;
  if (!c) { S.forhaand = null; S.overlever = null; return; }
  const t = S.valgt !== "stoed" && !kanBruge(S.valgt) ? "stoed" : S.valgt;
  S.forhaand = udfoerSlag(S.struktur, c.x, c.y, t, passivSaet());
  S.overlever = overlevende(S.forhaand);
}

function udfoer(h) {
  if (!h) return;
  if (h.type === "koeb") koebTeknik(h.id);
  else if (h.type === "udrust") udrust(h.id);
  else if (h.type === "ekstra") koebEkstra(h.id);
  else if (h.type === "world") rejsTil(h.w);
  else if (h.type === "rebirth") tagRebirth();
}

function ned(e) {
  e.preventDefault();
  lyd.start();
  const p = punkt(e);

  for (const k of L.knap) {
    if (!iRundKnap(p, k)) continue;
    if (k.navn === "lyd") lyd.skift(); else { gemSpil(); location.href = "../"; }
    return;
  }
  for (const f of L.faner) {
    if (!iRekt(p, f)) continue;
    S.panel = S.panel === f.navn ? null : f.navn;
    saetSigte(null);
    lyd.koeb();
    return;
  }
  if (S.panel) {
    if (L.luk && iRundKnap(p, L.luk)) { S.panel = null; return; }
    for (const r of L.rader) if (iRekt(p, r)) { udfoer(r.handling); return; }
    return;
  }
  for (const b of L.teknik) {
    if (!iRekt(p, b)) continue;
    if (b.id === "stoed") { S.valgt = "stoed"; lyd.koeb(); return; }
    if (brugTilbage(b.id) <= 0) { lyd.nej(); return; }
    S.valgt = S.valgt === b.id ? "stoed" : b.id;
    lyd.koeb();
    return;
  }
  const c = celleUnder(p);
  if (c) { saetSigte(c); S.hint++; }
}

function flyt(e) {
  if (!S.sigte || S.panel) return;
  e.preventDefault();
  const c = celleUnder(punkt(e));
  if (!c) { saetSigte(null); return; }
  if (c.x !== S.sigte.x || c.y !== S.sigte.y) saetSigte(c);
}

function op(e) {
  if (S.panel) return;
  const s = S.sigte;
  if (!s) return;
  e.preventDefault();
  const c = L.gitter.celle;
  const foer = S.struktur ? fyldte(S.struktur) : 0;
  const farve = S.struktur ? (MAT[S.struktur.mat[idx(S.struktur, s.x, s.y)]] || MAT[1]).farve : "#fff";
  saetSigte(null);
  slaaPaa(s.x, s.y);
  if (S.struktur) {
    const vaek = foer - fyldte(S.struktur);
    if (vaek > 0)
      skaarer(L.gitter.x + s.x * c + c / 2, L.gitter.y + s.y * c + c / 2, farve, Math.min(30, 5 + vaek * 3));
  }
  layout();     // en ryddet blok kan have en anden størrelse end den forrige
}

canvas.addEventListener("pointerdown", ned);
canvas.addEventListener("pointermove", flyt);
canvas.addEventListener("pointerup", op);
canvas.addEventListener("pointercancel", () => saetSigte(null));
canvas.addEventListener("contextmenu", e => e.preventDefault());
addEventListener("keydown", e => { if (e.key === "Escape") S.panel = null; else if (e.key === "m") lyd.skift(); });

/* ---------- i gang ---------- */
layout();
hentSpil();
layout();

document.addEventListener("spilhal:klar", () => {
  spillerNavn = SPILHAL.spiller();
  hentSpil();
  S.panel = null;
  layout();
});
addEventListener("visibilitychange", () => { if (document.hidden) gemSpil(); });
addEventListener("pagehide", gemSpil);

let sidst = nu();
(function loop() {
  const t = nu();
  const dt = Math.min(0.05, t - sidst);
  sidst = t;
  opdater(dt);
  tegn();
  requestAnimationFrame(loop);
})();
</script>
