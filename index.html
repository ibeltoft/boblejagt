<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spilhallen">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Spilhallen</title>
<style>
  :root{
    --bag:#0e1330; --bag2:#141c46; --kort:#1b2350; --kant:rgba(255,255,255,.12);
    --tekst:#ffffff; --daemp:rgba(255,255,255,.62); --svag:rgba(255,255,255,.42);
    --guld:#ffd43b; --groen:#37b24d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bag);color:var(--tekst);
    font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Verdana,sans-serif;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(180deg,var(--bag2) 0%,var(--bag) 62%) no-repeat;
    padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + 16px)
            calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 16px)}
  .midt{max-width:720px;margin:0 auto}

  header{text-align:center;margin-bottom:22px}
  h1{margin:0;font-size:clamp(28px,8vw,40px);font-weight:800;letter-spacing:.02em}
  .under{margin:6px 0 0;color:var(--daemp);font-size:15px}

  /* spillerlinjen: hvem der spiller, og vejen til at skifte */
  .spiller{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 24px}
  .navn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
    background:rgba(255,255,255,.08);font-weight:800}
  .navn b{color:var(--guld)}
  .skift{padding:9px 14px;border:none;border-radius:999px;background:rgba(255,255,255,.10);
    color:var(--tekst);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}

  .liste{display:grid;gap:16px;grid-template-columns:1fr}
  @media (min-width:620px){.liste{grid-template-columns:1fr 1fr}}

  .spil{display:block;padding:18px;border-radius:24px;background:var(--kort);
    border:1px solid var(--kant);box-shadow:0 18px 50px rgba(0,0,0,.42);
    color:inherit;text-decoration:none}
  .top{display:flex;align-items:center;gap:14px}
  .top img{width:62px;height:62px;border-radius:16px;flex:0 0 auto}
  .navnelinje{font-size:21px;font-weight:800;line-height:1.15}
  .maerke{margin-top:3px;font-size:12px;letter-spacing:.10em;color:var(--svag);font-weight:700}
  .tekst{margin:12px 0 14px;color:var(--daemp);font-size:15px;line-height:1.45}
  .rekord{display:flex;align-items:baseline;gap:8px;padding:11px 14px;border-radius:14px;
    background:rgba(255,212,59,.10);font-weight:800}
  .rekord .who{color:var(--guld);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rekord .pt{margin-left:auto;font-size:19px;color:var(--guld)}
  .rekord.tom{background:rgba(255,255,255,.06);color:var(--svag);font-weight:700}
  .spilknap{display:block;margin-top:14px;padding:13px;border-radius:999px;background:var(--groen);
    text-align:center;font-weight:800;font-size:16px}

  details{margin-top:12px}
  summary{cursor:pointer;font-size:13px;color:var(--svag);font-weight:700;list-style:none}
  summary::after{content:" ▾"}
  details[open] summary::after{content:" ▴"}
  summary::-webkit-details-marker{display:none}
  ol{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
  ol li{display:flex;gap:10px;padding:6px 2px;border-top:1px solid rgba(255,255,255,.07)}
  ol li span:last-child{margin-left:auto;font-weight:800;color:var(--guld)}
  .plads{width:1.4em;color:var(--svag)}

  footer{margin-top:28px;text-align:center;color:var(--svag);font-size:13px;line-height:1.6}
</style>

<!-- ---------- spilhallens navneboks (samme markup i alle spil) ---------- -->
<style>
  #navneboks{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(8,11,32,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #navneboks[hidden]{display:none}
  #navneboks .kort{width:100%;max-width:320px;padding:26px 22px 20px;border-radius:24px;
    background:#1b2350;border:1px solid rgba(255,255,255,.12);
    box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center;color:#fff}
  #navneboks .mini{font-size:12px;letter-spacing:.16em;color:rgba(255,255,255,.42);font-weight:700}
  #navneboks h2{margin:8px 0 18px;font-size:24px;font-weight:800}
  /* 17px: under 16px zoomer iOS ind på feltet */
  #navneboks input{width:100%;padding:13px 14px;margin:0 0 14px;font-family:inherit;font-size:17px;font-weight:700;text-align:center;
    color:#fff;border:none;border-radius:14px;background:rgba(255,255,255,.10);outline:2px solid transparent}
  #navneboks input:focus{outline-color:#66d9e8}
  #navneboks button{width:100%;padding:14px;border:none;border-radius:999px;background:#37b24d;
    color:#fff;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer}
</style>
<div id="navneboks" hidden>
  <div class="kort">
    <div class="mini">SPILHALLEN</div>
    <h2>Hvem spiller?</h2>
    <input id="navnefelt" type="text" maxlength="14" placeholder="Dit navn"
           autocomplete="nickname" autocapitalize="words" spellcheck="false" enterkeyhint="go">
    <button id="navneknap" type="button">Gem</button>
  </div>
</div>

<div class="midt">
  <header>
    <h1>SPILHALLEN</h1>
    <p class="under">To spil i browseren. Ingen konto, ingen app-butik — de virker også uden internet.</p>
    <div class="spiller">
      <span class="navn">Spiller: <b id="hvem">—</b></span>
      <button class="skift" id="skiftknap" type="button">Skift</button>
    </div>
  </header>

  <div class="liste" id="liste"></div>

  <footer>
    Rekorderne gemmes på den telefon eller computer, du spiller på — de sendes ingen steder hen.<br>
    Læg linket på hjemmeskærmen, så ligger hallen som en app.
  </footer>
</div>

<script>
"use strict";
/* ============================================================
   SPILHAL — fælles spillernavn og highscore-tavle
   Nøglerne deles af alle spil på samme domæne, så forsiden kan vise
   rekorderne. Kontrakten står i repoets README — den samme kode ligger
   i hvert spil, så et spil stadig er én fil uden afhængigheder.
   ============================================================ */
const SPILHAL = {
  NAVNE_NOEGLE: "spilhal.spiller",
  MAKS: 10,
  tavleNoegle(spil) { return "spilhal.tavle." + spil; },

  // localStorage kan være blokeret (privat vindue, direkte filåbning) —
  // siden skal virke alligevel, bare uden at huske noget.
  spiller() { try { return localStorage.getItem(this.NAVNE_NOEGLE) || ""; } catch (e) { return ""; } },

  saetSpiller(navn) {
    const rent = String(navn || "").replace(/\s+/g, " ").trim().slice(0, 14) || "Spiller";
    try { localStorage.setItem(this.NAVNE_NOEGLE, rent); } catch (e) { }
    return rent;
  },

  tavle(spil) {
    try {
      const raa = JSON.parse(localStorage.getItem(this.tavleNoegle(spil)) || "[]");
      if (!Array.isArray(raa)) return [];
      return raa.filter(r => r && typeof r.point === "number" && typeof r.navn === "string");
    } catch (e) { return []; }
  },

  /* Én plads pr. navn — den bedste. Returnerer true, hvis navnet nu ligger øverst. */
  gem(spil, navn, point) {
    point = Math.round(point);
    if (!(point > 0) || !navn) return false;
    const liste = this.tavle(spil);
    const dato = new Date().toISOString().slice(0, 10);
    const i = liste.findIndex(r => r.navn === navn);
    if (i >= 0) {
      if (liste[i].point >= point) return false;
      liste[i] = { navn, point, dato };
    } else liste.push({ navn, point, dato });
    liste.sort((a, b) => b.point - a.point);
    if (liste.length > this.MAKS) liste.length = this.MAKS;
    try { localStorage.setItem(this.tavleNoegle(spil), JSON.stringify(liste)); } catch (e) { }
    return liste[0].navn === navn;
  },

  bedste(spil) { return this.tavle(spil)[0] || null; }
};

/* ---------- hallens indhold ----------
   Et nyt spil tilføjes her og i sin egen mappe. Intet andet skal røres. */
const SPIL = [
  {
    id: "boblejagt", navn: "Boblejagt", sti: "boblejagt/", ikon: "boblejagt/icon-192.png",
    maerke: "ARKADE · 3–11 MIN",
    tekst: "Pop slimklatterne, saml stjerner og find nye boblevåben i kisterne. Til de yngste."
  },
  {
    id: "klodsjagt", navn: "Klodsjagt", sti: "klodsjagt/", ikon: "klodsjagt/icon-192.png",
    maerke: "PUSLESPIL · 3–5 MIN",
    tekst: "Læg tre brikker ad gangen på et 8×8-bræt. Fyldte rækker og kolonner forsvinder."
  }
];

const tal = n => n.toLocaleString("da-DK");
const rent = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tegnHallen() {
  document.getElementById("hvem").textContent = SPILHAL.spiller() || "—";

  document.getElementById("liste").innerHTML = SPIL.map(spil => {
    const tavle = SPILHAL.tavle(spil.id);
    const bedste = tavle[0];
    const rekord = bedste
      ? '<div class="rekord"><span>🏆</span><span class="who">' + rent(bedste.navn) +
        '</span><span class="pt">' + tal(bedste.point) + "</span></div>"
      : '<div class="rekord tom">Ingen rekord endnu</div>';

    const flere = tavle.length > 1
      ? "<details><summary>Se hele tavlen (" + tavle.length + ")</summary><ol>" +
        tavle.map((r, i) =>
          '<li><span class="plads">' + (i + 1) + ".</span><span>" + rent(r.navn) +
          "</span><span>" + tal(r.point) + "</span></li>").join("") +
        "</ol></details>"
      : "";

    return '<a class="spil" href="' + spil.sti + '">' +
      '<div class="top"><img src="' + spil.ikon + '" alt="" width="62" height="62">' +
      '<div><div class="navnelinje">' + spil.navn + "</div>" +
      '<div class="maerke">' + spil.maerke + "</div></div></div>" +
      '<p class="tekst">' + spil.tekst + "</p>" +
      rekord + flere +
      '<span class="spilknap">Spil</span></a>';
  }).join("");
}

/* Navneboksen: den kommer af sig selv første gang, og ellers på "Skift". */
(function navneboks() {
  const boks = document.getElementById("navneboks");
  const felt = document.getElementById("navnefelt");
  const knap = document.getElementById("navneknap");

  function aabn() {
    felt.value = SPILHAL.spiller();
    boks.hidden = false;
    setTimeout(() => { try { felt.focus(); felt.select(); } catch (e) { } }, 60);
  }
  function luk() {
    SPILHAL.saetSpiller(felt.value);
    boks.hidden = true;
    tegnHallen();
  }
  knap.addEventListener("click", luk);
  felt.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); luk(); } });
  document.getElementById("skiftknap").addEventListener("click", aabn);
  if (!SPILHAL.spiller()) aabn();
})();

tegnHallen();
// tavlen kan være ændret i et spil i en anden fane, og siden vises igen efter et spil
addEventListener("pageshow", tegnHallen);
addEventListener("focus", tegnHallen);

/* Service worker gør hallen tilgængelig uden internet. Kræver http(s) —
   springes over ved direkte filåbning, og en fejl her må intet ødelægge. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
}
</script>
